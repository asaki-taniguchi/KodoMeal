<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>マイページ</title>

        <style>
        .mypage-section {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 16px;
            overflow: hidden;
        }

        .mypage-row {
            display: flex;
            justify-content: space-between;
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-decoration: none;
            color: black;
            cursor: pointer;
        }

        .mypage-row:hover {
            background-color: #f5f5f5;
        }

        .mypage-row:last-child {
            border-bottom: none;
        }

        body {
            max-width: 390px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .right-area {
            margin-left: auto;
            color: #999;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
            text-decoration: none;
            color: #333;
        }

        .bottom-nav {
            margin-top: 40px;
        }

        </style>
    </head>
    <body>

        <a href="javascript:history.back()" class="back-link">◀︎戻る</a>

        <h1>マイページ</h1>

        <p>ユーザー名：{{ request.user.username }}</p>

        <div class="mypage-section">
            <a href="{% url 'mypage_posts' %}" class="mypage-row">
                <span>投稿</span>
                <span class="right-area">
                    （{{ posts|length }}件）　＞
                </span>
            </a>

            <a href="{% url 'mypage_drafts' %}"  class="mypage-row">
                <span>下書き</span>
                <span class="right-area">
                    （{{ drafts|length }}件）　＞
                </span>
            </a>
        </div>

        <div class="mypage-section">
            <a href="{% url 'store_register' %}" class="mypage-row">
                <span>未掲載店舗登録</span>
                <span class="right-area">　＞</span>
            </a>
        
            <a href="{% url 'account_edit' %}" class="mypage-row">
                <span>アカウント編集</span>
                <span class="right-area">　＞</span>
            </a>

            <a href="{% url 'logout' %}" class="mypage-row">
                <span>ログアウト</span>
                <span class="right-area">　＞</span>
            </a>
        </div>

        <nav class="bottom-nav">
            <a href="{% url 'favorite_list' %}" class="nav-button">お気に入り</a>
            <a href="{% url 'app_top' %}" class="nav-button">検索する</a>
            <a href="{% url 'mypage' %}" class="nav-button">マイページ</a>
        </nav>

    </body>
    </html>
