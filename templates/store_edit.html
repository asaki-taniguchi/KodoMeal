<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗詳細編集</title>

    <style>
        body {
            max-width: 390px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .back-link {
            text-decoration: none;
            color: #333;
        }

        .required_note {
            color: red;
            font-size: 12px;
        }

        .form-section {
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            border: none;
            border-radius: 8px;
            background-color: orange;
            font-weight: bold;
            cursor: pointer;
        }

        .error-message {
            color: red;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <a href="{% url 'store_detail' store.id %}" class="bacl-link">◀︎戻る</a>

    <h1>店舗詳細編集</h1>

    <p class="required_note">※は必須項目です</p>

    {% if error_message %}
        <p class="error_message">{{ error_message }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-section">
            <div class="form-group">
                <label>店舗名※</label>
                <input type="text" name="name" value="{{ store.name }}">
            </div>

            <div class="form-group">
                <label>電話番号</label>
                <input type="text" name="phone_number" value="{{ store.phone_number }}">
            </div>

            <div class="form-group">
                <label>住所※</label>
                <input type="text" name="address" value="{{ store.address }}">
            </div>

            <div class="form-group">
                <label>定休日</label>
                <input type="text" name="regular_holiday" value="{{ store.regular_holiday }}">
            </div>

            <div class="form-group">
                <label>営業時間</label>
                <input type="text" name="business_hours" value="{{ store.business_hours }}">
            </div>

            <div class="form-group">
                <label>駐車場</label>
                <input type="text" name="parking_comment" value="{{ store.parking_comment }}">
            </div>
        </div>

        <button type="submit" class="submit-button">変更する</button>
    </form>

</body>
<html>
