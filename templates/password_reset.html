<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>パスワード再設定</title>

        <style>
        body {
            margin: 0;
            background-color: #fffaf0;
            font-family: sans-serif;
            color: #555;
        }

        .page-title {
            margin: 0;
            padding: 16px;
            text-align: center;
            background-color: #d9f1ef;
            font-size: 18px;
        }

        .reset-form {
            width: 90%;
            max-width: 360px;
            margin: 32px auto 20px;
        }

        .description {
            margin-bottom: 28px;
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .password-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #fff;
        }

        .password-wrapper input {
            width: 100%;
            padding: 12px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        .password-wrapper button {
            padding: 0 10px;
            border: none;
            background: none;
            cursor: pointer;
            color: #888;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            background-color: #f5b82e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error-area {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #e57373;
            border-radius: 8px;
            color: #c62828;
            background-color: #fff5f5;
            font-size: 13px;
        }

        .back-link {
            display: block;
            margin-top: 72px;
            text-align: center;
            color: #888;
            font-size: 13px;
        }
        </style>
    </head>
    <body>

        <h1 class="page-title">パスワード再設定</h1>

        <form method="post" class="reset-form">
            {% csrf_token %}

            <p class="dedcription">
                以下項目を入力し、パスワードを再設定してください
            </p>

            {% if not is_valid_link %}
                <div class="error-area">
                    パスワード再設定URLが無効です。<br>
                    もう一度、再設定URLを送信してください。
                </div>

            {% else %}

                {% if form.errors %}
                    <div class="error-area">
                        有効なパスワードを入力してください
                        {{ form.errors }}
                    </div>
                {% endif %}

                <p class="input-group">
                    <label>新パスワード</label><br>
                    <span class="password-wrapper">
                        {{ form.new_password1 }}
                        <button type="button" onclick="togglePassword('id_new_password1')">👁️</button>
                    </span>
                </p>

                <p class="input-group">
                    <label>新パスワード再入力</label><br>
                    <span class="password-wrapper">
                        {{ form.new_password2 }}
                        <button type="button" onclick="togglePassword('id_new_password2')">👁️</button>
                    </span>
                </p>

                <button type="submit" class="submit-link">変更する</button>

            {% endif %}
        </form>

        <a href="{% url 'login' %}" class="bacl-link">←ログイン画面に戻る</a>

        <script>
            function togglePassword(inputId) {
                const input = document.getElementById(inputId);

                if (input.type === 'password') {
                    input.type = 'text';
                } else {
                    input.type = 'password';
                }
            }
        </script>

    </body>
    <html>
