<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>アカウント作成</title>


        <style>
        body {
            margin: 0;
            background-color: #fffaf0;
            font-family: sans-serif;
            color: #555;
        }

        .back-link {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6aa7a3;
            font-size: 13px;
        }

        .register-title {
            margin: 0;
            padding: 16px;
            text-align: center;
            font-size: 20px;
        }

        .register-form {
            width: 90%;
            max-width: 360px;
            margin: 28px auto 20px;
        }

        .register-header {
            position: relative;
            background-color: #d9f1ef;
        }

        .description {
            width: 90%;
            max-width: 360px;
            margin: 28px auto 20px;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .note {
            margin: 6px 0 0;
            color: #888;
            font-size: 12px;
        }

        .password-wrapper {
            display: flex;
            align-items: center;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #fff;
        }

        .password-wrapper input {
            border: none;
            margin-top: 0;
        }

        .password-wrapper button {
            padding: 0 10px;
            border: none;
            background: none;
            color: #888;
            cursor: pointer;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            margin-top: 36px;
            border: none;
            border-radius: 8px;
            background-color: #f5b82e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-link {
            display: block;
            text-align: center;
            color: #6aa7a3;
            font-size: 13px;
        }

        .error-message {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #e57373;
            border-radius: 8px;
            color: #c62828;
            background-color: #fff5f5;
            font-size: 13px;
        }

        .toast {
            width: 220px;
            margin: 18px auto 0;
            padding: 12px;
            text-align: center;
            color: #fff;
            background-color: #333;
            border-radius: 6px;
            font-size: 13px;
        }
        </style>
    </head>
    <body>
    <header class="register-header">
        <a href="{% url 'login' %}" class="back-link">◀︎戻る</a>
        <h1 class="register-title">新規登録</h1>
    </header>

        <p class="description">
            以下全ての項目を入力してください
        </p>
        
        <form method="post" class="register-form">
            {% csrf_token %}

            {% if form.errors %}    {# エラー表示 #}
                <div class="error-message">
                    {{ form.errors }}
                </div>
            {% endif %}
        
            <div class="input-group">
                <label>ユーザー名</label><br>
                {{ form.username }}<br>
                <p class="note">変更できません</p>
            </div>

            <div class="input-group">
                <label>メールアドレス</label><br>
                {{ form.email }}
            </div>

            <div class="input-group">
                <label>パスワード</label><br>
                <div class="password-wrapper">
                    {{ form.password1 }}
                    <button type="button" onclick="togglePassword('id_password1')">👁️</button>
                </div>
            </div>
            
            <div class="input-group">
                <label>パスワード再入力</label><br>
                <div class="password-wrapper">
                    {{ form.password2 }}
                    <button type="button" onclick="togglePassword('id_password2')">👁️</button>
                </div>
                <p class="note">半角英数字8文字以上20文字以内</p>
            </div>
            
            <button type="submit" class="register-button">登録</button>

            {% if registered %}
            <div class="toast">登録完了しました</div>

            <script>
                setTimeout(function()) {
                    window.location.href = {% url 'app_top' %};
                }, 1500);
            </script>
        {% endif %}

        </form>
        
        <a href="{% url 'login'%}" class="login-link">
            ログインはこちら
        </a>

        <script>
            function togglePassword(inputId) {
                const input = document.getElementById(inputId);

                if (input.type === 'password') {
                    input.type = 'text';
                } else {
                    input.type = 'password';
                }
            }
        </script>


    </body>
    </html>
