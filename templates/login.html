<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ログイン</title>

        <style>
        body {
            width: 390px;
            max-width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            background-color: #fffffc;
            font-family: sans-serif;
            color: #555;
        }

        .login-title {
            margin: 0;
            padding: 16px;
            text-align: center;
            background-color: #d8f1f0;
            font-size: 20px;
            color: #4d3e16;
        }

        .login-main-area {
            margin-top: 70px;
            padding: 36px 0 40px;
            background-color: #fffbf3;
        }

        .login-form {
            width: 90%;
            max-width: 360px;
            margin: 0px auto 20px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: inline-block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            margin-top: 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            background: #fff;
        }

        .password-input-area {
            position: relative;
        }

        .password-input-area input {
            width: 100%;
            padding-right: 40px;
            box-sizing: border-box;
        }

        .password-toggle-button {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background-color: #fbc127ff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
        }

        .login-note {
            margin: 14px 0 32px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        .link-area {
            width: 90%;
            max-width: 360px;
            margin: 0 auto;
            text-align: center;
            font-size: 13px;
        }

        .link-area p {
            margin: 14px 0;
        }

        .link-area a {
            color: #6aa7a3;
        }

        .back-link {
            display: inline-block;
            margin-top: 34px;
        }

        .error-area {
            margin: 0 0 18px;
            color: #d14343;
            font-size: 13px;
            line-height: 1.6;
        }

        .error-area ul {
            margin: 0;
            padding-left: 18px;
        }

        .error-area li {
            margin-bottom: 4px;
        }

        .login-error {
            margin: 0 0 24px;
            color: #e53935;
            font-size: 13px;
            text-align: left;
        }
        </style>
    </head>
    <body>

        <h1 class="login-title">ログイン</h1>

    <div class="login-main-area">
        <form method="post" action="{% url 'login' %}" class="login-form">
            {% csrf_token %}

            {% if form.errors %}
                <div class="login-error">
                    メールアドレスまたはパスワードが違います
                </div>
            {% endif %}
        
            <p class='input-group'>
                <label>メールアドレス</label><br>
                {{ form.email }}
            </p>

            <div class='input-group'>
                <label>パスワード</label><br>

                <div class="password-input-area">
                    {{ form.password }}

                    <button type="button" class="password-toggle-button" onclick="togglePassword('id_password')">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">ログイン</button>

            <p class="login-note">ログインするとトップ画面に戻ります</p>
        </form>

        <div class="link-area">
            <p class="register-text">
                アカウントをお持ちでない方は
                <a href="{% url 'register' %}" class="register-link">こちら</a>
            </p>

            <p class="reset-text">
                パスワードを忘れた方は
                <a href="{% url 'password_reset_sent' %}" class="reset-link">こちら</a>
            </p>

            <a href="{% url 'app_top' %}" class="back-link">
                ← トップ画面に戻る
            </a>
        </div>
    </div>

        <script>
            function togglePassword(inputId) {
                const input = document.getElementById(inputId)

                if (input.type === 'password') {
                    input.type = 'text';
                } else {
                    input.type = 'password';
                }
            }
        </script>

    </body>
    </html>
