<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ログイン</title>

        <style>
        body {
            margin: 0;
            background-color: #fffbf3;
            font-family: sans-serif;
            color: #555;
        }

        .login-title {
            margin: 0;
            padding: 16px;
            text-align: center;
            background-color: #d8f1f0;
            font-size: 20px;
        }

        .login-form {
            width: 90%;
            max-width: 360px;
            margin: 32px auto 20px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background-color: #f5b82e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .link-area {
            width: 90%;
            max-width: 360px;
            margin: 0 auto;
            text-align: center;
            font-size: 13px;
        }

        .link-area a {
            color: #6aa7a3;
        }

        .back-link {
            display: inline-block;
            margin-top: 28px;
        }

        .error-area {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #e57373;
            border-radius: 8px;
            color: #c62828;
            background-color: #fff5f5;
            font-size: 13px;
        }
        </style>
    </head>
    <body>

        <h1 class="login-title">ログイン</h1>

        <form method="post" action="{% url 'login' %}" class="login-form">
            {% csrf_token %}

            {% if form.errors %}
                <div class="errors-area">
                    {{ form.errors }}
                </div>
            {% endif %}
        
        <p class='input-group'>
            <label>メールアドレス</label><br>
            {{ form.email }}
        </p>

        <p class='input-group'>
            <label>パスワード</label><br>
            {{ form.password }}
        </p>

            <button type="submit" class="login-button">ログイン</button>
        </form>

        <div class="link-area">
            <p class="register-text">
                アカウントをお持ちでない方は
                <a href="{% url 'register' %}" class="register-link">こちら</a>
            </p>

            <p class="reset-text">
                パスワードを忘れた方は
                <a href="{% url 'password_reset_sent' %}" class="reset-link">こちら</a>
            </p>

            <a href="{% url 'app_top' %}" class="back-link">
                ← トップ画面に戻る
            </a>
        </div>

    </body>
    </html>
