<!DOCTYPE html>
 <html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿編集</title>

    <style>
        body {
            max-width: 390px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .error-message {
            color: red;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-size: border-box;
        }

        .replace-image-label {
            display: block;
            cursor: pointer;
        }

        .image-edit-section {
            margin: 12px 0;
        }

        .image-note {
            font-size: 12px;
            color: #777;
            margin: 2px 0;
        }

        .post-edit-image-list {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: nowrap;
        }

        .post-edit-image-item {
            width: 82px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .post-edit-image {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 8px;
        }

        .delete-image-label {
            font-size: 11px;
            color: #777;
        }

        .post-edit-add-image-list {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }

        .post-edit-add-image-box {
            width: 82px;
            height: 82px;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #777;
            box-sizing: border-box;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-link">◀︎戻る</a>

    <h1>投稿を編集</h1>

    {% if error_message %}
        <p class="error-message">{{ error_message }}</p>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="image-edit-section">
            <p class="image-note">※最大4枚まで投稿可能（1枚必須）。写真をタップすると変更できます。</p>

            <div class="post-edit-image-list">
                {% for image in post_images %}
                    <div class="post-edit-image-item">
                        <label class="replace-image-label">
                            <img src="{{ image.image.url }}" alt="投稿画像" class="post-edit-image">
                            <input type="file" name="replace_image_{{ image.id }}" accept="image/*" hidden>
                        </label>

                        <label class="delete-image-label">
                            <input type="checkbox" name="delete_images" value="{{ image.id }}">
                            削除
                        </label>
                    </div>
                {% endfor %}

                {% for empty_slot in empty_slots%}
                    <label class="post-edit-add-image-box">
                        <input type="file" name="add_images" accept="image/*" hidden>
                        ＋写真
                    </label>
                {% endfor %}
            </div>

            {% if not post_images %}
                <p class="image-note">登録済みの画像はありません</p>
            {% endif %}
        </div>

        <div class="form-group">
            <label>メニュー名<label>
            <input type="text" name="menu_name" value="{{ post.menu_name }}" required>
        </div>
    
        <div class="form-group">
            <label>対象年齢<label>
            <select name="target_age">
                <option value="">年齢を選択する</option>
                <option value="乳児" {% if post.target_age == "乳児" %}selected{% endif %}>乳児</option>
                <option value="未就学児" {% if post.target_age == "未就学児" %}selected{% endif %}>未就学児</option>
                <option value="小学生" {% if post.target_age == "小学生" %}selected{% endif %}>小学生</option>
            </select>
        </div>

        <div class="form-group">
            <p>量</p>
        
            <label>
                <input type="radio" name="quantity" value="1" {% if post.quantity == 1%}checked{% endif %}>
                1
            </label>
            <label>
                <input type="radio" name="quantity" value="2" {% if post.quantity == 2%}checked{% endif %}>
                2
            </label>
            <label>
                <input type="radio" name="quantity" value="3" {% if post.quantity == 3%}checked{% endif %}>
                3
            </label>
            <label>
                <input type="radio" name="quantity" value="4" {% if post.quantity == 4%}checked{% endif %}>
                4
            </label>
            <label>
                <input type="radio" name="quantity" value="5" {% if post.quantity == 5%}checked{% endif %}>
                5
            </label>
        </div>

        <div class="form-group">
            <p>店舗設備情報</p>

            <label>
                <input type="checkbox" name="is_stroller_ok" value="1"
                    {% if post.is_stroller_ok %}checked{% endif %}>
                ベビーカーOK
            </label><br>

            <label>
                <input type="checkbox" name="has_kids_chair" value="1"
                    {% if post.has_kids_chair %}checked{% endif %}>
                キッズチェア
            </label><br>

            <label>
                <input type="checkbox" name="has_diaper_table" value="1"
                    {% if post.has_diaper_table %}checked{% endif %}>
                おむつ交換台
            </label><br>

            <label>
                <input type="checkbox" name="has_kids_space" value="1"
                    {% if post.has_kids_space %}checked{% endif %}>
                キッズスペース
            </label><br>

            <label>
                <input type="checkbox" name="has_kids_cutlery" value="1"
                    {% if post.has_kids_cutlery %}checked{% endif %}>
                キッズカトラリー
            </label><br>

            <p>座敷タイプ</p>

            <label>
                <input type="checkbox" name="seat_type" value="1"
                    {% if 1 in selected_seat_types %}checked{% endif %}>
                座敷
            </label><br>

            <label>
                <input type="checkbox" name="seat_type" value="2"
                    {% if 2 in selected_seat_types %}checked{% endif %}>
                テーブル
            </label><br>

            <label>
                <input type="checkbox" name="seat_type" value="3"
                    {% if 3 in selected_seat_types %}checked{% endif %}>
                個室
            </label><br>
        </div>

        <div class="form-group">
            <label>総合評価</label>
            <select name="rating" required>
                <option value="">選択してください</option>
                <option value="1" {% if post.rating == 1 %}selected{% endif %}>1</option>
                <option value="2" {% if post.rating == 2 %}selected{% endif %}>2</option>
                <option value="3" {% if post.rating == 3 %}selected{% endif %}>3</option>
                <option value="4" {% if post.rating == 4 %}selected{% endif %}>4</option>
                <option value="5" {% if post.rating == 5 %}selected{% endif %}>5</option>
            </select>
        </div>

        <div class="form-group">
            <label>コメント</label>
            <textarea name="content" rows="5" cols="30" placeholder="一言でもOKです">{{ post.content }}</textarea>
        </div>

        <button type="submit" name="save_type" value="draft">下書き保存</button>
        <button type="submit" name="save_type" value="publish">更新する</button>
    </form>

</body>
</html>
