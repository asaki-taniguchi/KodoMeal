<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KodoMeal{% endblock %}</title>

    <style>
        body {
            padding-bottom: 72px;
        }

        .bottom-nav {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            height: 64px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #ffffff;
            border-top: 1px solid #ddd;
            z-index: 100;
        }

        .nav-button {
            color: #555;
            text-decoration: none;
            font-size: 13px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .login-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.35);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .login-modal-overlay.is-active {
            display: flex;
        }

        .login-modal {
            position: relative;
            width: 82%;
            max-width: 320px;
            padding: 36px 18px;
            background-color: #fff;
            text-align: center;
        }

        .login-modal-close {
            position: absolute;
            top: 12px;
            right: 14px;
            border: none;
            background: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }

        .login-modal-icon {
            margin: 0 0 12px;
            font-size: 24px;
        }

        .login-modal-text {
            margin: 0;
            font-size: 15px;
            font-weight: bold;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% block content %}
    {% endblock %}

    {% block bottom_nav %}
    <nav class="bottom-nav">
        {% if user.is_authenticated %}
            <a href="{% url 'favorite_list' %}" class="nav-button">お気に入り</a>
            <a href="{% url 'app_top' %}" class="nav-button">検索する</a>
            <a href="{% url 'mypage' %}" class="nav-button">マイページ</a>
        {% else %}
            <button type="button" class="nav-button" onclick="openLoginModal()">お気に入り</button>
            <a href="{% url 'app_top' %}" class="nav-button">検索する</a>
            <a href="{% url 'login' %}" class="nav-button">ログイン</a>
        {% endif %}
    </nav>
    {% endblock %}

    <div id="login-modal" class="login-modal-overlay">
        <div class="login-modal">
            <button type="button" class="login-modal-close" onclick="closeLoginModal()">×</button>

            <p class="login-modal-icon">🔒</p>

            <p class="login-modal-text">
                この機能はログインが必要です
            </p>
        </div>
    </div>

    <script>
        function openLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.add('is-active');
        }

        function closeLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.remove('is-active');
        }
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
