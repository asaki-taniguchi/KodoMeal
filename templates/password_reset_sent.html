<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>パスワード再設定URL送信</title>

        <style>
            body {
            margin: 0;
            background-color: #fffaf0;
            font-family: sans-serif;
            color: #555;
        }

        .page-title {
            margin: 0;
            padding: 16px;
            text-align: center;
            background-color: #d9f1ef;
            font-size: 18px;
        }

        .reset-form {
            width: 90%;
            max-width: 360px;
            margin: 32px auto 20px;
        }

        .description {
            margin-bottom: 28px;
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #f5b82e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error-area {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #e57373;
            border-radius: 8px;
            color: #c62828;
            background-color: #fff5f5;
            font-size: 13px;
        }

        .toast {
            width: 220px;
            margin: 18px auto 0;
            padding: 12px;
            text-align: center;
            color: #fff;
            background-color: #333;
            border-radius: 6px;
            font-size: 13px;
        }

        .back-link {
            display: block;
            margin-top: 72px;
            text-align: center;
            color: #888;
            font-size: 13px;
        }
        </style>
    </head>
    <body>

        <h1 class="page-title">パスワード再設定URL送信</h1>

        <form method="post" class="reset-form">
            {% csrf_token %}

            <p class="description">
                登録しているメールアドレスを入力してください<br>
                パスワード再設定用のリンクをお送りします
            </p>

            {% if form.errors %}
                <div class="error-area">
                    {{ form.errors }}
                </div>
            {% endif %}

            <p class="input-group">
                <label>メールアドレス</label><br>
                {{ form.email }}
            </p>

            <button type="submit" class="submit-button">送信する</button>

            {% if messages %}
                {% for message in messages %}
                    <div class="toast">{{ message }}</div>
                {% endfor %}
            {% endif %}
        </form>

        <a href="{% url 'login' %}" class="back-link">
            ← ログイン画面に戻る
        </a>

    </body>
    </html>
