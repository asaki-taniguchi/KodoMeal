<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>下書き一覧</title>

        <style>
            body {
                max-width: 390px;
                margin: 0 auto;
                padding: 16px;
                box-sizing: border-box;
            }

            .draft-card {
                border: 1px solid #ddd;
                border-radius: 16px;
                padding: 14px;
                margin-bottom:12px;
            }

            .draft-card-link {
                text-decoration: none;
                color: inherit;
            }

            .draft-card p {
                margin: 6px 0;
            }

            .back-link {
                text-decoration: none;
                color: #333;
            }

        </style>
    </head>
    <body>

        <a href="{% url 'mypage' %}" class="back-link">◀︎戻る</a>

        <h1>下書き一覧</h1>

        {% if drafts %}
            {% for draft in drafts %}
                <a href="{% url 'post_edit' draft.id %}" class="draft-card-link">
                    <h2>{{ post.store.name }}</h2>
                    <div class="draft-card">
                        <p>メニュー名：{{ draft.menu_name }}</p>
                        <p>対象年齢：{{ draft.target_age }}</p>
                        <p>量：{{ draft.quantity }}</p>
                        <p>評価：{{ draft.rating }}</p>
                        <p>{{ draft.content }}</p>
                    </div>
                </a>
            {% endfor %}
            {% else %}
                    <p>下書きはまだありません</p>
            {% endif %}

    </body>
    </html>
