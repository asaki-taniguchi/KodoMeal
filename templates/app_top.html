{% extends 'base.html' %}

{% block title %}KodoMeal 検索画面{% endblock %}

{% block extra_css %}
<style>
    body {
        max-width: 390px;
        margin: 0 auto;
        padding: 16px;
        padding-bottom: 88px;
        box-sizing: border-box;
    }

    .header {
        text-align: center;
    }

    .app-title {
        margin: 32px 0;
        font-size: 36px;
    }

    .search-form {
        text-align: center;
    }

    .keyword-input {
        width: 80%;
        padding: 8px;
        box-sizing: border-box;
    }

    .menu-tag-group {
        margin: 16px 0;
    }

    .menu-tag-button {
        display: inline-block;
        margin: 4px;
    }

    .detail-search-area {
        margin: 12px 0;
    }

    .detail-search-box {
        border: 1px solid #ccc;
        border-radius: 12px;
        padding: 12px;
        margin: 8px auto 16px;
        max-width: 340px;
        text-align: left;
    }

    .detail-search-box h2 {
        font-size: 14px;
        margin: 0 0 8px;
    }

    .search-chip {
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 4px 8px;
        font-size: 12px;
    }

    .detail-search-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: flex-end;
    }

    .seat-type-label {
        font-size: 12px;
        color: #666;
        
    }

    .search-button {
        margin-top: 16px;
        padding: 8px 24px;
    }
</style>
{% endblock %}

{% block content %}
<div class="header">
    <h1 class="app-title">KodoMeal</h1>
</div>
        
<form method="get" action="{% url 'search_result' %}" class="search-form">
    <input type="text" class="keyword-input" name="keyword" placeholder="キーワード入力">
            
    <div class="menu-tag-group">
        <h2 class="menu-title">Kids Menu</h2>
                
        <label class="menu-tag-button">
            <input type="checkbox" name="menu" value="うどん">
            うどん
        </label>

        <label class="menu-tag-button">
            <input type="checkbox" name="menu" value="ラーメン">
            ラーメン
        </label>

        <label class="menu-tag-button">
            <input type="checkbox" name="menu" value="カレー">
            カレー
        </label>

        <label class="menu-tag-button">
            <input type="checkbox" name="menu" value="パスタ">
            パスタ
        </label>
    </div>
            
    {% include 'partials/detail_search_form.html' %}

    <button type="submit" class="search-button">検索する</button>
</form>
        
{% endblock %}
