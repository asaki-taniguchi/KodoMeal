{% extends 'base.html' %}

{% block title %}KodoMeal 検索画面{% endblock %}

{% block extra_css %}
<style>
* {
    box-sizing: border-box;
}

.title-area {
    padding: 52px 20px 12px;
    background: #fffffcff;
    text-align: center;
}

.app-title {
    margin: 0;
    font-size: 44px;
    line-height: 1;
    color: #5a4a2f;
    font-weight: 700;
}

.search-form {
    background: #fffffcff;
    text-align: center;
}

.keyword-input {
    width: 300px;
    max-width: 90%;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
}

    .keyword-input::placeholder {
color: #b7b7b7;
}

.search-main-area {
    margin-top: 12px;
    padding: 18px 24px 52px;
    overflow: hidden;
}

.menu-title {
    margin: 0 0 12px;
    font-size: 13px;
    color: #5a4a2f;
    text-align: left;
    font-weight: 500;
}

.menu-tag-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    margin-bottom: 20px;
}

.menu-tag-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    height: 30px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #eee;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
    font-size: 11px;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
}

.menu-tag-button input {
    display: none;
}

.menu-tag-button:has(input:checked) {
    background: #e8f7f6;
    border-color: #5bbdb7;
    color: #333;
    font-weight: bold;
}

.detail-search-area {
    margin: 20px 0 48px;
    text-align: center;
}

.detail-search-area summary {
    display: inline-block;
    min-width: 168px;
    padding: 9px 18px;
    border-radius: 999px;
    background: #caebeaff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.14);
    cursor: pointer;
    list-style: none;
    font-size: 13px;
}

.detail-search-area summary::-webkit-details-marker {
    display: none;
}

.detail-search-box {
    border: 1px solid #d8d8d8;
    border-radius: 18px;
    padding: 16px 10px 18px;
    margin: 14px auto 0;
    width: 315px;
    background: #fff;
    text-align: left;
}

.detail-search-box h2 {
    font-size: 12px;
    margin: 0 0 10px;
    padding: 0 4px 8px;
    border-bottom: 1px solid #eee;
    color: #5a4a2f;
}

.facility-top-layout {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 12px;
}

.facility-top-layout .facility-row {
    margin-bottom: 0;
}

.facility-main-column {
    display: flex;
    flex-direction: column;
}

.facility-top-layout .facility-row {
    margin-bottom: 0;
}

.facility-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
}

.facility-bottom-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 0;
}

.facility-bottom-row .chip-large {
    width: 88px;
}

.seat-type-area {
    width: 104px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.seat-type-label {
    margin: 0 0 4px;
    color: #666;
    font-size: 9px;
    text-align: center;
}

.seat-chip-row {
    display: flex;
    justify-content: center;
    gap: 3px;
}

.search-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 26px;
    padding: 0 4px;
    border: 1px solid #cfcfcf;
    border-radius: 7px;
    background: #fff;
    color: #333;
    font-size: 10px;
    cursor: pointer;
    white-space: nowrap;
    box-sizing: border-box;
}

.search-chip input {
    display: none;
}

.search-chip:has(input:checked) {
    background: #e8f7f6;
    border-color: #5bbdb7;
    color: #333;
    font-weight: bold;
}

.chip-large {
    width: 86px;
}

.chip-small {
    width: 33px;
    font-size: 8px;
    padding: 0 2px;
}

.search-button {
    min-width: 204px;
    padding: 13px 24px;
    border: none;
    border-radius: 999px;
    background: #fbc127ff;
    color: #333;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    cursor: pointer;
}
</style>
{% endblock %}

{% block content %}
<div class="title-area">
    <h1 class="app-title">KodoMeal</h1>
</div>
        
<form method="get" action="{% url 'search_result' %}" class="search-form">
    <input type="text" class="keyword-input" name="keyword" placeholder="🔍 キーワード入力">
            
    <div class="search-main-area">
        <h2 class="menu-title">Kids Menu</h2>

        <div class="menu-tag-group">
                
            <label class="menu-tag-button">
                <input type="checkbox" name="menu" value="うどん">
                うどん
            </label>

            <label class="menu-tag-button">
                <input type="checkbox" name="menu" value="ラーメン">
                ラーメン
            </label>

            <label class="menu-tag-button">
                <input type="checkbox" name="menu" value="カレー">
                カレー
            </label>

            <label class="menu-tag-button">
                <input type="checkbox" name="menu" value="パスタ">
                パスタ
            </label>
        </div>
            
        {% include 'partials/detail_search_form.html' %}

        <button type="submit" class="search-button">検索する</button>
    </div>
</form>
        
{% endblock %}
