<!DOCTYPE html>
 <html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未掲載店舗登録</title>

     <style>
        body {
            max-width: 390px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .back-link {
            text-decoration: none;
            color: #333;
        }

        .required_note {
            color: red;
            font-size: 12px;
        }

        .image-area {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }

        .image-box {
            width: 90px;
            height: 90px;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #777;
            box-sizing: border-box;
        }

        .image-note {
                font-size: 12px;
                color: #777;
                margin: 2px 0;
            }

        .form-section {
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            border: none;
            border-radius: 8px;
            background-color: orange;
            font-weight: bold;
            cursor: pointer;
        }

        .error-message {
            color: red;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-link">◀︎戻る</a>

    <h1>未掲載店舗登録</h1>

    <p class="required_note">※は必須項目です</p>

    {% if error_message %}
        <p class="error-message">{{ error_message }}</p>
    {% endif %}

    <form method = "post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="image-area">
            <label class="image-box">
                <input type="file" name="images" accept="image/*" multiple hidden>
                写真を追加
            </label>

            <div class="image-box">
                写真を追加
            </div>
            
            <div class="image-box">
                ＋
            </div>
        </div>

        <p class="image-note">※最大4枚まで登録可能（1枚必須）。</p>
        <p class="image-note">※1枚目の写真が一覧に表示されます。</p>

        <div class="form-section">
            <div class="form-group">
                <label>店舗名※</label>
                <input type="text" name="name" placeholder="店舗を入力" value="{{ name }}">
            </div>

            <div class="form-group">
                <label>電話番号</label>
                <input type="text" name="phone_number" placeholder="電話番号を入力" value="{{ phone_number }}">
            </div>

            <div class="form-group">
                <label>住所※</label>
                <input type="text" name="address" placeholder="住所を入力" value="{{ address }}">
            </div>

            <div class="form-group">
                <label>定休日</label>
                <input type="text" name="regular_holiday" placeholder="定休日を入力" value="{{ regular_holiday }}">
            </div>

            <div class="form-group">
                <label>営業時間</label>
                <input type="text" name="business_hours" placeholder="営業時間を入力" value="{{ business_hours }}">
            </div>

            <div class="form-group">
                <label>駐車場</label>
                <input type="text" name="parking_comment" placeholder="駐車場情報を入力" value="{{ parking_comment }}">
            </div>
        </div>

        <button type="submit" class="submit-button">登録する</button>
    </form>

</body>
</html>
